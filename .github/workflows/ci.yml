name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  web:
    # Frontend gates (Phase 5.1 globe): install, unit-test, and build the web
    # app. Runs on every push/PR — previously only pytest ran in CI, so a
    # frontend regression (e.g. a broken lazy chunk) could ship unnoticed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # cesium@1.143 requires node >= 22 (see web/package-lock.json engines)
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Build (tsc strict + vite)
        run: npm run build
